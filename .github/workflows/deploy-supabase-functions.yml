name: Deploy admin Supabase functions

# Deploys the admin portal's edge functions to the SportCliq Supabase project.
# Runs by hand from the Actions tab, and by itself when a function changes on main.
# Needs the repo secret SUPABASE_ACCESS_TOKEN (same token used in the playarena repo).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: qxafigbrfpxdklwoqkxj
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check the token is set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Add SUPABASE_ACCESS_TOKEN in GitHub, Settings, Secrets and variables, Actions"; exit 1
          fi
      - name: Deploy
        run: supabase functions deploy admin-dispatch --project-ref "$PROJECT_REF" --yes
